# DQN Training Configuration
# SOURCE: Proposal 003, Phase 3 - Training Pipeline

# Data Configuration
data:
  dataset_path: "data/ml_training/rl_training_dataset_20251024_010201.h5"  # FIXED: Threshold -38.0 dBm (4.2% handover rate, 1754 A4 events)
  train_split: "train"  # 1812 samples
  val_split: "val"      # 388 samples
  test_split: "test"    # 390 samples

# Environment Configuration
environment:
  state_dim: 53
  action_dim: 6
  max_episodes_per_reset: null  # null = unlimited

# Network Configuration
network:
  hidden_dims: [256, 256]
  # SOURCE: Badini et al. (2024) IEEE TAES, Section IV.B

# Training Hyperparameters
training:
  episodes: 500                     # Total training episodes (full training with large dataset)
  max_steps_per_episode: 200       # Maximum steps per episode
  batch_size: 64                   # Training batch size
  learning_rate: 0.0001            # Adam learning rate
  # SOURCE: Mnih et al. (2015) Nature - typical DQN learning rate

  gamma: 0.99                      # Discount factor
  # SOURCE: Sutton & Barto (2018) - standard discount factor

  # Exploration Schedule
  epsilon_start: 1.0               # Initial exploration rate
  epsilon_end: 0.01                # Final exploration rate
  epsilon_decay: 0.995             # Exponential decay rate
  # SOURCE: Mnih et al. (2015) - epsilon-greedy exploration

  # Experience Replay
  replay_buffer_capacity: 100000   # Replay buffer size
  min_replay_size: 1000            # Minimum samples before training
  # SOURCE: Mnih et al. (2015) - experience replay configuration

  # Target Network Update
  target_update_freq: 10           # Update target network every N episodes
  # SOURCE: Mnih et al. (2015) - target network update frequency

# Checkpointing
checkpointing:
  enabled: true
  save_dir: "data/models/dqn"
  save_freq: 10                    # Save every N episodes (reduced for quick test)
  keep_last_n: 5                   # Keep only last N checkpoints
  save_best: true                  # Save best model based on val reward

# Logging
logging:
  # TensorBoard
  tensorboard_enabled: true
  tensorboard_dir: "logs/tensorboard/dqn"
  log_freq: 10                     # Log metrics every N episodes

  # Console Logging
  console_log_level: "INFO"        # DEBUG, INFO, WARNING, ERROR
  progress_bar: true               # Show tqdm progress bar

  # File Logging
  log_to_file: true
  log_file_dir: "logs/training"

# Early Stopping
early_stopping:
  enabled: true
  patience: 50                     # Stop if no improvement for N episodes
  min_delta: 0.1                   # Minimum improvement threshold
  monitor: "val_reward"            # Metric to monitor (val_reward, train_reward)
  # SOURCE: Prechelt (1998) "Early Stopping - But When?"

# Validation
validation:
  enabled: true
  val_freq: 10                     # Validate every N episodes
  val_episodes: 10                 # Number of validation episodes

# Device Configuration
device:
  use_cuda: true                   # Use GPU if available
  cuda_device: 0                   # CUDA device ID
  deterministic: false             # Use deterministic algorithms (slower but reproducible)

# Random Seeds (for reproducibility)
seeds:
  global_seed: 42
  torch_seed: 42
  numpy_seed: 42
  env_seed: 42
